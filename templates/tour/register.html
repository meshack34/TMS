{% extends "main.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">

<div class="auth-container">
    <div class="auth-card shadow-lg">
        <h2 class="mb-4 text-center auth-title">Planner Registration</h2>

        <form method="post" novalidate class="auth-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">
                            {% for error in field.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Create Planner Account</button>
            </div>
        </form>

        <p class="mt-3 text-center auth-footer">
            Already have an account? <a href="{% url 'login' %}">Log in here</a>.
        </p>
    </div>
</div>
{% endblock %}
