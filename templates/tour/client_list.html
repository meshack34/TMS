{% extends "base_dashboard.html" %}
{% block content %}
<div class="container my-4">
    <h2>Clients</h2>
    <a href="{% url 'client_create' %}" class="btn btn-primary mb-3">Add Client</a>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th style="width:150px;">Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for client in clients %}
            <tr>
                <td>{{ client.first_name }} {{ client.last_name }}</td>
                <td>{{ client.email }}</td>
                <td>{{ client.phone_number }}</td>
                <td>
                    <a href="{% url 'client_update' client.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'client_delete' client.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="4">No clients found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
