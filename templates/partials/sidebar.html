<!-- Sidebar styling -->
<style>
  .sidebar {
    width: 250px;
    background-color: #004d80;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    overflow-y: auto;
    z-index: 1020;
    transition: transform 0.3s ease-in-out;
  }

  .nav-link {
    padding: 8px 12px;
    transition: background 0.2s, color 0.2s;
  }

  .nav-link:hover {
    background-color: rgba(255, 255, 255, 0.15);
    color: #fff !important;
  }

  .active-link {
    background-color: #ffffff !important;
    color: #004d80 !important;
    font-weight: 600;
  }

  /* Responsive Sidebar (hidden on small screens) */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
    }
    .sidebar.show {
      transform: translateX(0);
    }
    body {
      padding-left: 0 !important;
    }
    .content {
      margin-left: 0 !important;
    }
  }
</style>

<!-- Toggle button (visible only on small screens) -->
<button class="btn btn-primary d-md-none" type="button" 
        onclick="document.getElementById('sidebarMenu').classList.toggle('show')" 
        style="position: fixed; top: 15px; left: 15px; z-index: 1050;">
  <i class="bi bi-list"></i>
</button>
